# End-to-end tests: the plugin and its locked SDK in a real WooCommerce, against the KetaPay staging API with
# sandbox keys. Every scenario is tagged with its WE2E-xxx id from the WooCommerce test catalogue. Runs on
# every merge to main, on pull requests that change the plugin or its SDK, nightly and by hand.
#
# Settings come from Infisical (project ketapay-sdks, shared by every KetaPay SDK, environment staging):
#   KETAPAY_E2E_BASE_URL, KETAPAY_E2E_SECRET_KEY (required)
# Until they exist, the job reports "not configured" and passes.
name: E2E

on:
  push:
    branches: [main] # every merge: a breaking change shows up in minutes, not the next morning
  pull_request:
    branches: [main] # catch a break before it merges; only the code and tests that can change the result
    paths:
      - 'src/**'
      - 'ketapay-woocommerce.php'
      - 'composer.lock'
      - 'tests/E2E/**'
      - 'phpunit.e2e.xml.dist'
      - 'scripts/test-e2e.sh'
      - '.wp-env.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly, 04:00 Lagos (after the SDKs' runs)

permissions:
  contents: read

# A new push to a pull request replaces its running E2E. Other runs never cancel each other.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E against staging
    # Forks and Dependabot can't log in to Infisical, so their pull requests skip this job
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a normal run takes 1 to 2 minutes
    permissions:
      contents: read
      id-token: write # Infisical login
    steps:
      - name: Fetch E2E settings from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: 'oidc'
          oidc-audience: 'https://infisical.com'
          identity-id: 'ef5c6cbd-0f7e-49a9-a6b7-8d115c2abbd2'
          project-slug: 'ketapay-sdks-pz5w' # one Infisical project for every KetaPay SDK
          env-slug: 'staging'
      - name: Is E2E configured?
        id: configured
        run: |
          if [ -n "$KETAPAY_E2E_BASE_URL" ] && [ -n "$KETAPAY_E2E_SECRET_KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "### E2E not configured yet: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Is staging answering?
        if: steps.configured.outputs.yes == 'true'
        # A down or half-reset staging turned every test into a 60 s timeout (72 minute runs on
        # 2026-11-07). One cheap authenticated read that needs the database, three tries, then a
        # clear failure instead of running the suite.
        run: |
          for try in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -H "Authorization: Bearer $KETAPAY_E2E_SECRET_KEY" "$KETAPAY_E2E_BASE_URL/events?limit=1" || true)
            [ "$code" = "200" ] && exit 0
            echo "Try $try: GET /events answered $code"
            sleep 5
          done
          echo "::error::The staging API is not answering (GET /events gave $code), so the tests did not run. Check the latest Deploy Staging run in the api repo."
          exit 1
      - uses: actions/checkout@v7
        if: steps.configured.outputs.yes == 'true'
        with:
          path: ketapay-woocommerce # wp-env names the plugin after this folder
      - uses: shivammathur/setup-php@v2
        if: steps.configured.outputs.yes == 'true'
        with:
          php-version: '8.1'
          coverage: none
      - uses: ramsey/composer-install@v4
        if: steps.configured.outputs.yes == 'true'
        with:
          working-directory: ketapay-woocommerce
      - uses: actions/setup-node@v7
        if: steps.configured.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ketapay-woocommerce/package-lock.json
      - name: Start WordPress with the latest WooCommerce and this plugin
        if: steps.configured.outputs.yes == 'true'
        working-directory: ketapay-woocommerce
        env:
          WP_ENV_PHP_VERSION: '8.1'
        run: |
          npm ci
          npx wp-env start
      - name: E2E tests
        if: steps.configured.outputs.yes == 'true'
        working-directory: ketapay-woocommerce
        env:
          KETAPAY_E2E_RUN_ID: e2e-woo-gh-${{ github.run_id }} # stamped on all test data, for cleanup
        shell: bash # with pipefail: without it, tee's success would hide failing tests
        run: npm run test:e2e -- --no-progress --testdox | tee e2e-report.txt
      - name: Test report
        if: always() && steps.configured.outputs.yes == 'true'
        working-directory: ketapay-woocommerce
        run: |
          { echo '### E2E against staging'; echo '```'; cat e2e-report.txt 2>/dev/null || echo 'No report.'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
